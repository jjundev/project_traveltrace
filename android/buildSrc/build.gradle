plugins {
    id 'java'
}

repositories {
    mavenCentral()
    google()
    gradlePluginPortal()
}

dependencies {
    implementation gradleApi()
    implementation localGroovy()   // for groovy.json.JsonSlurper used by the tasks
    testImplementation 'junit:junit:4.13.2'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

// Sources are UTF-8 (Korean comments/strings); force it so a CP949 host does not corrupt them.
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

test {
    useJUnit()
    // Gradle ProjectBuilder injects synthetic classes via reflection; JDK 17 strong
    // encapsulation requires these opens (otherwise: "Could not inject synthetic classes").
    jvmArgs(
        '--add-opens=java.base/java.lang=ALL-UNNAMED',
        '--add-opens=java.base/java.util=ALL-UNNAMED',
        '--add-opens=java.base/java.lang.invoke=ALL-UNNAMED'
    )
}
