import com.traveltrace.build.ModelIdGuardTask
import com.traveltrace.build.StalenessGuardTask
import com.traveltrace.build.Constants
import com.traveltrace.build.VisionModelsFile

plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.hilt)
    // Roborazzi 의 Gradle 플러그인은 Kotlin Gradle 플러그인(KotlinTarget)을 요구한다.
    // 이 앱은 Java 전용이라 플러그인은 적용하지 않고, 라이브러리 + 시스템 프로퍼티로
    // captureRoboImage() 를 직접 호출해 스크린샷을 기록한다(아래 testOptions).
}

// ---------------------------------------------------------------------------
// A2: read the COMMITTED, machine-generated vision model IDs at CONFIGURATION
// time (AGP buildConfigField must be registered during configuration — it is
// NOT fed by an execution-time task). Ordinary builds need no network / no API
// keys; they only read this committed file, so builds are reproducible & offline.
// ---------------------------------------------------------------------------
Map readVisionModels() {
    // Missing-file / blank-id hard-fail lives in VisionModelsFile (buildSrc) — single,
    // unit-tested source of truth (see VisionModelsFileTest). Any exception it throws
    // propagates out of configuration and aborts the build (PRD §4.3).
    def r = VisionModelsFile.read(rootProject.file("gradle/visionModels.generated.json"))
    if (r.rulesetVersion != Constants.RULESET_VERSION) {
        logger.warn("WARNING: vision model ruleset (${r.rulesetVersion}) != code (${Constants.RULESET_VERSION}). "
                + "Run ./gradlew resolveVisionModels. (Hard-fails on the 'check' lifecycle.)")
    }
    return [gemini: r.gemini, openai: r.openAi]
}

String localProp(String key) {
    def f = rootProject.file("local.properties")
    if (!f.exists()) return ""
    def props = new Properties()
    f.withInputStream { props.load(it) }
    return props.getProperty(key, "")
}

/** Runtime key: blank is allowed (build still succeeds) but warned about. */
String runtimeKey(String key) {
    def v = localProp(key)
    if (!v) {
        logger.warn("WARNING: ${key} is blank in local.properties — runtime calls using it will fail until set.")
    }
    return v
}

def vision = readVisionModels()

android {
    namespace 'com.traveltrace.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.traveltrace.app'
        minSdk 33
        targetSdk 35
        versionCode 1
        versionName '0.1.0'

        // exportSchema=true 의 산출물 경로. 커밋해서 스키마 변경 이력을 남긴다.
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ["room.schemaLocation": "$projectDir/schemas".toString()]
            }
        }

        // A2: resolved vision model IDs (from committed generated file).
        buildConfigField "String", "GEMINI_VISION_MODEL", "\"${vision.gemini}\""
        buildConfigField "String", "OPENAI_VISION_MODEL", "\"${vision.openai}\""

        // A3: API keys. Vision keys used at RUNTIME by Epic D providers; Geocoding is a
        // REST key; Places via Places.initialize(); Maps via manifest meta-data.
        buildConfigField "String", "GEMINI_API_KEY", "\"${runtimeKey('GEMINI_API_KEY')}\""
        buildConfigField "String", "OPENAI_API_KEY", "\"${runtimeKey('OPENAI_API_KEY')}\""
        buildConfigField "String", "PLACES_API_KEY", "\"${runtimeKey('PLACES_API_KEY')}\""
        buildConfigField "String", "GEOCODING_API_KEY", "\"${runtimeKey('GEOCODING_API_KEY')}\""

        manifestPlaceholders = [MAPS_API_KEY: localProp('MAPS_API_KEY')]
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding 'UTF-8'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    // Robolectric 이 레이아웃/스타일/문자열 리소스를 인플레이트하려면 필요.
    testOptions {
        unitTests {
            includeAndroidResources = true
            all {
                // Roborazzi 스크린샷 캡처(플러그인 없이 라이브러리 직접 호출):
                //  - pixelCopyRenderMode=hardware : NATIVE 그래픽스 모드의 하드웨어 렌더 경로.
                //  - roborazzi.output.dir : 골든 위치. src/test/screenshots 에 커밋되어 있다.
                //    (ScreenshotHarness 가 이 프로퍼티를 직접 읽어 파일 경로를 만든다 - 우리가
                //    쓰는 captureRoboImage(View, String, RoborazziOptions) 오버로드는 이 값을
                //    자동으로 참조하지 않는다.)
                //  - roborazzi.test.record / roborazzi.test.verify : 기본은 verify 모드
                //    (골든과 다르면 AssertionError 로 테스트가 FAIL). `-Proborazzi.record` 를
                //    주면 record 모드로 전환되어 골든을 무조건 다시 기록한다(비교/실패 없음).
                //    두 모드는 상호배타적으로 유지한다 - 둘 다 true 면 Roborazzi 가
                //    VerifyAndRecord 로 취급해 검증 없이 계속 덮어쓴다.
                it.systemProperty 'robolectric.pixelCopyRenderMode', 'hardware'
                boolean recordScreenshots = project.hasProperty('roborazzi.record')
                it.systemProperty 'roborazzi.test.record', recordScreenshots ? 'true' : 'false'
                it.systemProperty 'roborazzi.test.verify', recordScreenshots ? 'false' : 'true'
                it.systemProperty 'roborazzi.output.dir',
                        "${projectDir}/src/test/screenshots".toString()
            }
        }
    }
}

dependencies {
    implementation libs.androidx.core
    implementation libs.androidx.appcompat
    implementation libs.material
    implementation libs.androidx.constraintlayout
    implementation libs.androidx.recyclerview
    implementation libs.androidx.fragment
    implementation libs.androidx.lifecycle.viewmodel
    implementation libs.androidx.lifecycle.livedata
    implementation libs.androidx.navigation.fragment
    implementation libs.androidx.navigation.ui

    implementation libs.hilt.android
    annotationProcessor libs.hilt.compiler

    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.gson
    implementation libs.okhttp
    debugImplementation libs.okhttp.logging

    implementation libs.room.runtime
    annotationProcessor libs.room.compiler

    implementation libs.androidx.exifinterface
    implementation libs.play.services.maps
    implementation libs.places

    testImplementation libs.junit
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    testImplementation libs.roborazzi
}

// ---------------------------------------------------------------------------
// A2 foundation guards, wired into the `check` lifecycle (run by CI/release).
// ---------------------------------------------------------------------------
tasks.register("modelIdGuard", ModelIdGuardTask) {
    group = "verification"
    description = "Fail the build if a model-ID literal is hardcoded in app sources."
    sources.from(fileTree("src/main").matching { include "**/*.java", "**/*.xml" })
}

tasks.register("visionModelStalenessGuard", StalenessGuardTask) {
    group = "verification"
    description = "Fail (ruleset mismatch) / warn (age) on the committed vision model resolution."
    generatedFile.set(rootProject.file("gradle/visionModels.generated.json"))
    expectedRulesetVersion.set(Constants.RULESET_VERSION)
    maxAgeDays.set(30L)
}

tasks.named("check") {
    dependsOn "modelIdGuard", "visionModelStalenessGuard"
}
